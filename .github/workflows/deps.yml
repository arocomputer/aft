name: Dependency updates

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: deps-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.capture.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Select patch updates without changing the compiler
        env:
          GOTOOLCHAIN: local
        run: go get -u=patch ./... && go mod tidy
      - name: Check and audit the updated dependencies
        run: |
          ./x check
          ./x audit
      - name: Capture checked dependency changes
        id: capture
        run: |
          files=(go.mod go.sum)
          if git diff --quiet -- "${files[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --binary -- "${files[@]}" > "$RUNNER_TEMP/dependency-update.patch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.capture.outputs.changed == 'true'
        with:
          name: dependency-update
          path: ${{ runner.temp }}/dependency-update.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-update
          path: ${{ runner.temp }}
      - name: Publish only the checked dependency patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='chore/dependency-updates'
          prs=$(gh pr list --state open --base main --head "$branch" --json number,author)
          pr_count=$(jq 'length' <<< "$prs")
          pr_number=$(jq -r '[.[] | select(.author.login == "github-actions[bot]" or .author.login == "app/github-actions")][0].number // empty' <<< "$prs")
          remote_ref="refs/heads/$branch"
          gh auth setup-git
          remote_refs=$(git ls-remote origin "$remote_ref")
          remote_sha=$(awk 'NR == 1 { print $1 }' <<< "$remote_refs")
          if [ "$pr_count" -gt 0 ] && [ -z "$pr_number" ]; then
            echo 'The reserved dependency branch has an open PR not created by this workflow.' >&2
            exit 1
          fi
          if [ "$pr_count" -eq 0 ] && [ -n "$remote_sha" ]; then
            echo 'The reserved dependency branch exists without an open updater PR; refusing to overwrite it.' >&2
            exit 1
          fi
          if [ -n "$pr_number" ]; then
            foreign_commits=$(gh pr view "$pr_number" --json commits --jq \
              '.commits[] | select(.messageHeadline != "chore: update dependencies" or (.authors | length) == 0 or any(.authors[]; .login != "github-actions[bot]" and .login != "app/github-actions")) | .oid')
            [ -z "$foreign_commits" ] || {
              echo 'The updater PR contains non-automation commits; refusing to replace them.' >&2
              exit 1
            }
          fi
          git apply --cached --binary "$RUNNER_TEMP/dependency-update.patch"
          mapfile -d '' -t changed_files < <(git diff --cached --name-only -z)
          allowed_files=(go.mod go.sum)
          for file in "${changed_files[@]}"; do
            allowed=false
            for allowed_file in "${allowed_files[@]}"; do
              [ "$file" = "$allowed_file" ] && allowed=true
            done
            [ "$allowed" = true ] || { echo 'Update patch contains an unexpected path.' >&2; exit 1; }
          done
          [ -n "$(git diff --cached --name-only)" ] || { echo 'Update patch is empty.' >&2; exit 1; }
          [ -z "$(git diff --cached --summary)" ] || { echo 'Update patch changes file modes or types.' >&2; exit 1; }
          git diff --cached --check
          python3 - "$RUNNER_TEMP/dependency-summary.md" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          def requirements(text):
              """Return module versions from go.mod require directives."""
              packages, in_require = {}, False
              for line in text.splitlines():
                  line = line.split('//', 1)[0].strip()
                  if line == ')':
                      in_require = False
                  elif line.startswith('require '):
                      line = line[len('require '):].strip()
                      if line == '(':
                          in_require = True
                          continue
                  elif not in_require:
                      continue
                  fields = line.split()
                  if len(fields) >= 2 and fields[1].startswith('v'):
                      packages[fields[0]] = fields[1]
              return packages

          before = requirements(subprocess.check_output(['git', 'show', 'HEAD:go.mod'], text=True))
          after = requirements(subprocess.check_output(['git', 'show', ':go.mod'], text=True))
          rows = [(name, before.get(name, '—'), after.get(name, '—'))
                  for name in sorted(before.keys() | after.keys())
                  if before.get(name) != after.get(name)]
          lines = ['### Updated packages']
          if rows:
              lines.extend(['| Package | From | To |', '| --- | --- | --- |'])
              for name, old, new in rows:
                  name = name.replace('|', r'\|')
                  lines.append(f'| `{name}` | `{old}` | `{new}` |')
          else:
              lines.append('Checksum changes only; no module versions changed.')
          Path(sys.argv[-1]).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -c core.hooksPath=/dev/null commit -m 'chore: update dependencies'
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="$remote_ref:$remote_sha" origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
          sha=$(git rev-parse HEAD)
          # Track the branch before CI so a failed run can be refreshed next week.
          if [ -z "$pr_number" ]; then
            gh pr create --draft --base main --head "$branch" \
              --title 'chore: update dependencies' \
              --body 'Grouped Go patch updates. Isolated checks and vulnerability audit passed; full CI is pending.'
            pr_number=$(gh pr view "$branch" --json number --jq .number)
          elif [ "$(gh pr view "$pr_number" --json isDraft --jq .isDraft)" = false ]; then
            gh pr ready "$pr_number" --undo
          fi
          # GITHUB_TOKEN pushes do not trigger CI; dispatch it on the exact branch.
          gh workflow run ci.yml --ref "$branch"
          run_id=''
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch "$branch" --limit 20 \
              --json databaseId,headSha,event \
              --jq ".[] | select(.headSha == \"$sha\" and .event == \"workflow_dispatch\") | .databaseId" \
              | head -n 1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Could not find the validation run for the exact update commit.' >&2; exit 1; }
          gh run watch "$run_id" --exit-status
          body_file="$RUNNER_TEMP/dependency-pr-body.md"
          {
            cat <<EOF
          ## Grouped dependency update

          This PR contains Go patch updates produced by the scheduled updater.

          EOF
            cat "$RUNNER_TEMP/dependency-summary.md"
            cat <<EOF

          ### Validation
          - The repository check suite and vulnerability audit passed in the read-only update job.
          - GitHub Actions CI passed on the exact dependency-update commit $sha before marking the PR ready.
          EOF
          } > "$body_file"
          gh pr edit "$pr_number" --body-file "$body_file"
          if [ "$(gh pr view "$pr_number" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$pr_number"
          fi
